  cupertino_icons: ^1.0.2
  overlay_support: ^2.1.0
  firebase_core: ^2.17.0
  firebase_messaging: ^14.2.0
  firebase_analytics: ^10.6.0
  flutter_local_notifications: ^18.0.1
